---
# Reglages de l'environnement prod (les autres valeurs par defaut sont dans roles/common/defaults/main.yml)
sup_kpi_env: prod
sup_kpi_central_port: 8080

# Couleurs des voyants (nombre d'erreurs)
sup_kpi_hour_warn: 1
sup_kpi_hour_crit: 20
sup_kpi_day_warn: 1
sup_kpi_day_crit: 50

# Nombre de jours d'historique gardes par le central
sup_kpi_retention_days: 30

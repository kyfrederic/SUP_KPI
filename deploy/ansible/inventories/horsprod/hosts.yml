---
# Serveurs de l'environnement horsprod.   >>> A MODIFIER : remplace les noms et adresses par les tiens <<<
#
# - groupe "central" : LE serveur qui affiche la page web (un seul par environnement)
# - groupe "agents"  : TOUS les serveurs a surveiller (le central peut en faire partie)
# Les applications de chaque serveur se declarent dans host_vars/<nom-du-serveur>.yml
all:
  vars:
    ansible_user: webadmin
  children:
    central:
      hosts:
        srv-hpr-app01:
    agents:
      hosts:
        srv-hpr-app01:
        srv-hpr-app02:
